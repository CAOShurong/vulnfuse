name: VulnFuse
description: Correlate duplicate vulnerability findings across scanners while preserving every source record.
author: CAOShurong
branding:
  icon: shield
  color: purple
inputs:
  reports:
    description: Newline-separated file paths or glob patterns for scanner reports.
    required: true
  baseline-reports:
    description: Optional newline-separated paths or globs for reports from a previous run.
    required: false
  output:
    description: Destination for the correlated report.
    required: false
    default: vulnfuse-results.sarif
  format:
    description: "Output format: json, sarif, csv, markdown, or html."
    required: false
    default: sarif
  threshold:
    description: Minimum explainable match score from 0 to 100.
    required: false
    default: "70"
  scope:
    description: Correlate the same asset instance or the root cause across assets.
    required: false
    default: instance
  fail-on:
    description: "Fail on none, info, low, medium, high, or critical clusters."
    required: false
    default: none
  fail-on-new:
    description: "With baseline-reports, fail only when a new cluster meets this severity."
    required: false
    default: none
  fail-on-scan-set-change:
    description: "With baseline-reports, fail after writing when scanner tools or per-tool report counts changed."
    required: false
    default: "false"
  max-bytes:
    description: Maximum bytes accepted for each input report.
    required: false
    default: "104857600"
outputs:
  findings:
    description: Number of original source findings.
  clusters:
    description: Number of correlated vulnerability clusters.
  duplicates-collapsed:
    description: Number of duplicate source records collapsed.
  single-tool:
    description: Number of clusters reported by exactly one scanner.
  multi-tool:
    description: Number of clusters reported by more than one scanner.
  new:
    description: Number of clusters not present in the baseline.
  updated:
    description: Number of matched clusters whose significant evidence changed.
  absent:
    description: Number of baseline clusters absent from the current reports.
  unchanged:
    description: Number of clusters unchanged from the baseline.
  scan-set-changed:
    description: Whether scanner tools or per-tool report counts changed from the baseline.
  report:
    description: Path to the generated report.
runs:
  using: node24
  main: packages/action/dist/index.cjs

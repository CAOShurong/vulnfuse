name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Build release artifacts
        run: |
          mkdir -p release
          npm pack -w @vulnfuse/core --pack-destination release
          npm pack -w vulnfuse --pack-destination release
          npm sbom --sbom-format cyclonedx --omit dev > release/vulnfuse-sbom.cdx.json
          tar -czf "release/vulnfuse-action-${GITHUB_REF_NAME}.tar.gz" action.yml packages/action/dist LICENSE README.md
          sha256sum release/* > release/SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "VulnFuse $GITHUB_REF_NAME" --generate-notes

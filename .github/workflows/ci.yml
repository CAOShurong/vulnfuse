name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} verification
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Audit production dependency tree
        run: npm audit --omit=dev --audit-level=high
      - name: Ensure the committed Action bundle is current
        if: matrix.node == '24'
        run: git diff --exit-code -- packages/action/dist

  windows-smoke:
    name: Windows CLI smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Generate a portable checksum manifest on Windows
        shell: pwsh
        run: |
          $fixtureDirectory = Join-Path "${{ runner.temp }}" "vulnfuse-release-fixtures"
          New-Item -ItemType Directory -Path $fixtureDirectory | Out-Null
          Copy-Item packages/core/test/fixtures/sarif.json (Join-Path $fixtureDirectory "sample.sarif")
          Copy-Item packages/core/test/fixtures/openvex.json (Join-Path $fixtureDirectory "sample.openvex.json")
          $manifestPath = Join-Path $fixtureDirectory "SHA256SUMS.txt"
          node scripts/write-release-checksums.mjs $fixtureDirectory $manifestPath
          $manifest = Get-Content $manifestPath
          if ($manifest.Count -ne 2 -or $manifest -match "[\\/]vulnfuse-release-fixtures[\\/]") {
            throw "Checksum manifest is not a flat two-fixture inventory"
          }
          foreach ($line in $manifest) {
            if ($line -notmatch "^([0-9a-f]{64})  ([A-Za-z0-9._+@-]+)$") {
              throw "Malformed checksum entry: $line"
            }
            $actual = (Get-FileHash -Algorithm SHA256 (Join-Path $fixtureDirectory $Matches[2])).Hash.ToLowerInvariant()
            if ($actual -ne $Matches[1]) {
              throw "Checksum mismatch for $($Matches[2])"
            }
          }
      - name: Correlate fixture reports
        shell: pwsh
        run: |
          node packages/cli/dist/index.js merge packages/core/test/fixtures/trivy.json packages/core/test/fixtures/grype.json --format json --output "${{ runner.temp }}/vulnfuse.json"
          $result = Get-Content -Raw "${{ runner.temp }}/vulnfuse.json" | ConvertFrom-Json
          if ($result.summary.inputFindings -ne 4 -or $result.summary.clusters -ne 3 -or $result.summary.duplicatesCollapsed -ne 1) {
            throw "Unexpected fixture correlation summary"
          }
          $openvex = node packages/cli/dist/index.js inspect packages/core/test/fixtures/openvex.json --json | ConvertFrom-Json
          if ($openvex[0].format -ne "openvex" -or $openvex[0].findings -ne 3 -or $openvex[0].active -ne 3) {
            throw "Unexpected OpenVEX inspection summary"
          }
          $partialOutput = "${{ runner.temp }}/vulnfuse-partial.json"
          $partialProcess = Start-Process -FilePath node -ArgumentList @(
            "packages/cli/dist/index.js",
            "merge",
            "packages/core/test/fixtures/sarif-incomplete.json",
            "--format",
            "json",
            "--output",
            $partialOutput,
            "--fail-on-incomplete"
          ) -Wait -PassThru -WindowStyle Hidden
          if ($partialProcess.ExitCode -ne 1 -or -not (Test-Path $partialOutput)) {
            throw "Incomplete SARIF gate did not preserve output and exit 1"
          }
          $partial = Get-Content -Raw $partialOutput | ConvertFrom-Json
          if ($partial.summary.inputFindings -ne 1 -or $partial.reports[0].warnings.Count -ne 5) {
            throw "Unexpected incomplete SARIF evidence"
          }
          $uriBaseOutput = "${{ runner.temp }}/vulnfuse-uri-base.json"
          node packages/cli/dist/index.js merge packages/core/test/fixtures/sarif-uri-bases.json --format json --output $uriBaseOutput
          $uriBase = Get-Content -Raw $uriBaseOutput | ConvertFrom-Json
          if ($uriBase.summary.inputFindings -ne 2 -or $uriBase.summary.clusters -ne 1 -or $uriBase.summary.duplicatesCollapsed -ne 1) {
            throw "Portable SARIF URI-base paths did not correlate on Windows"
          }
          if ($uriBase.clusters[0].primary.location.uri -ne "src/lib/memory.c") {
            throw "Unexpected portable SARIF URI-base path"
          }
          $cycloneXml = node packages/cli/dist/index.js inspect packages/core/test/fixtures/cyclonedx-vex.xml --json | ConvertFrom-Json
          if ($cycloneXml[0].format -ne "cyclonedx" -or $cycloneXml[0].findings -ne 1 -or $cycloneXml[0].active -ne 1) {
            throw "Unexpected CycloneDX XML inspection summary"
          }
          $versionCurrent = "${{ runner.temp }}/vulnfuse-version-current.sarif"
          $versionDocument = Get-Content -Raw packages/core/test/fixtures/sarif.json | ConvertFrom-Json
          $versionDocument.runs[0].tool.driver.semanticVersion = "2.26.2"
          $versionDocument | ConvertTo-Json -Depth 100 | Set-Content -Encoding utf8 $versionCurrent
          $versionOutput = "${{ runner.temp }}/vulnfuse-version-drift.json"
          $versionProcess = Start-Process -FilePath node -ArgumentList @(
            "packages/cli/dist/index.js",
            "diff",
            "--baseline",
            "packages/core/test/fixtures/sarif.json",
            $versionCurrent,
            "--format",
            "json",
            "--output",
            $versionOutput,
            "--fail-on-scan-set-change"
          ) -Wait -PassThru -WindowStyle Hidden
          if ($versionProcess.ExitCode -ne 1 -or -not (Test-Path $versionOutput)) {
            throw "Embedded scanner-version gate did not preserve output and exit 1"
          }
          $versionDiff = Get-Content -Raw $versionOutput | ConvertFrom-Json
          $versionChange = $versionDiff.scanSetChange.changedToolVersions[0]
          if ($versionDiff.scanSetChange.changedToolVersions.Count -ne 1 -or $versionChange.tool -ne "CodeQL" -or $versionChange.baseline.versions[0] -ne "2.20.0" -or $versionChange.current.versions[0] -ne "2.26.2") {
            throw "Unexpected embedded scanner-version drift evidence"
          }
          $categoryBaseline = "${{ runner.temp }}/vulnfuse-category-baseline.sarif"
          $categoryCurrent = "${{ runner.temp }}/vulnfuse-category-current.sarif"
          $categoryDocument = Get-Content -Raw packages/core/test/fixtures/sarif.json | ConvertFrom-Json
          $categoryDocument.runs[0] | Add-Member -NotePropertyName automationDetails -NotePropertyValue @{ id = "monorepo/main/2026-08-11" }
          $categoryDocument | ConvertTo-Json -Depth 100 | Set-Content -Encoding utf8 $categoryBaseline
          $categoryDocument.runs[0].automationDetails.id = "monorepo/release/2026-08-12"
          $categoryDocument | ConvertTo-Json -Depth 100 | Set-Content -Encoding utf8 $categoryCurrent
          $categoryOutput = "${{ runner.temp }}/vulnfuse-category-drift.json"
          $categoryProcess = Start-Process -FilePath node -ArgumentList @(
            "packages/cli/dist/index.js",
            "diff",
            "--baseline",
            $categoryBaseline,
            $categoryCurrent,
            "--format",
            "json",
            "--output",
            $categoryOutput,
            "--fail-on-scan-set-change"
          ) -Wait -PassThru -WindowStyle Hidden
          if ($categoryProcess.ExitCode -ne 1 -or -not (Test-Path $categoryOutput)) {
            throw "SARIF automation-category gate did not preserve output and exit 1"
          }
          $categoryDiff = Get-Content -Raw $categoryOutput | ConvertFrom-Json
          $categoryChange = $categoryDiff.scanSetChange.changedSarifAutomationCategories[0]
          if ($categoryDiff.scanSetChange.changedSarifAutomationCategories.Count -ne 1 -or $categoryChange.tool -ne "CodeQL" -or $categoryChange.baseline.categories[0] -ne "monorepo/main" -or $categoryChange.current.categories[0] -ne "monorepo/release") {
            throw "Unexpected SARIF automation-category drift evidence"
          }

  action-smoke:
    name: Bundled GitHub Action smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: fuse
        name: Correlate fixture reports with the repository Action
        uses: ./
        with:
          reports: |
            packages/core/test/fixtures/trivy.json
            packages/core/test/fixtures/grype.json
          baseline-reports: packages/core/test/fixtures/trivy.json
          format: json
          output: ${{ runner.temp }}/vulnfuse-action.json
          fail-on-new: high
      - name: Validate report and Action outputs
        env:
          FINDINGS: ${{ steps.fuse.outputs.findings }}
          CLUSTERS: ${{ steps.fuse.outputs.clusters }}
          COLLAPSED: ${{ steps.fuse.outputs.duplicates-collapsed }}
          NEW: ${{ steps.fuse.outputs.new }}
          UPDATED: ${{ steps.fuse.outputs.updated }}
          ABSENT: ${{ steps.fuse.outputs.absent }}
          UNCHANGED: ${{ steps.fuse.outputs.unchanged }}
          REPORT: ${{ steps.fuse.outputs.report }}
        run: |
          test "$FINDINGS" = "4"
          test "$CLUSTERS" = "3"
          test "$COLLAPSED" = "1"
          test "$NEW" = "1"
          test "$UPDATED" = "1"
          test "$ABSENT" = "0"
          test "$UNCHANGED" = "1"
          test -s "$REPORT"
      - id: openvex
        name: Inspect OpenVEX with the repository Action
        uses: ./
        with:
          reports: packages/core/test/fixtures/openvex.json
          format: json
          output: ${{ runner.temp }}/vulnfuse-openvex.json
      - name: Validate OpenVEX Action outputs
        env:
          FINDINGS: ${{ steps.openvex.outputs.findings }}
          ACTIVE: ${{ steps.openvex.outputs.active }}
          SUPPRESSED: ${{ steps.openvex.outputs.suppressed }}
          REPORT: ${{ steps.openvex.outputs.report }}
        run: |
          test "$FINDINGS" = "3"
          test "$ACTIVE" = "3"
          test "$SUPPRESSED" = "0"
          test -s "$REPORT"
      - id: incomplete
        name: Gate incomplete SARIF after preserving partial evidence
        continue-on-error: true
        uses: ./
        with:
          reports: packages/core/test/fixtures/sarif-incomplete.json
          format: json
          output: ${{ runner.temp }}/vulnfuse-partial.json
          fail-on-incomplete: "true"
      - name: Validate incomplete SARIF Action outputs
        env:
          OUTCOME: ${{ steps.incomplete.outcome }}
          INCOMPLETE: ${{ steps.incomplete.outputs.incomplete-reports }}
          FINDINGS: ${{ steps.incomplete.outputs.findings }}
          REPORT: ${{ steps.incomplete.outputs.report }}
        run: |
          test "$OUTCOME" = "failure"
          test "$INCOMPLETE" = "1"
          test "$FINDINGS" = "1"
          test -s "$REPORT"
      - id: uri-base
        name: Correlate portable SARIF URI-base paths
        uses: ./
        with:
          reports: packages/core/test/fixtures/sarif-uri-bases.json
          format: json
          output: ${{ runner.temp }}/vulnfuse-uri-base.json
      - name: Validate SARIF URI-base Action outputs
        env:
          FINDINGS: ${{ steps.uri-base.outputs.findings }}
          CLUSTERS: ${{ steps.uri-base.outputs.clusters }}
          COLLAPSED: ${{ steps.uri-base.outputs.duplicates-collapsed }}
          REPORT: ${{ steps.uri-base.outputs.report }}
        run: |
          test "$FINDINGS" = "2"
          test "$CLUSTERS" = "1"
          test "$COLLAPSED" = "1"
          test "$(node -p "require('$REPORT').clusters[0].primary.location.uri")" = "src/lib/memory.c"
      - id: cyclonedx-xml
        name: Inspect CycloneDX XML VEX with the repository Action
        uses: ./
        with:
          reports: packages/core/test/fixtures/cyclonedx-vex.xml
          format: json
          output: ${{ runner.temp }}/vulnfuse-cyclonedx-xml.json
      - name: Validate CycloneDX XML Action outputs
        env:
          FINDINGS: ${{ steps.cyclonedx-xml.outputs.findings }}
          ACTIVE: ${{ steps.cyclonedx-xml.outputs.active }}
          REPORT: ${{ steps.cyclonedx-xml.outputs.report }}
        run: |
          test "$FINDINGS" = "1"
          test "$ACTIVE" = "1"
          test "$(node -p "require('$REPORT').clusters[0].primary.component.purl")" = "pkg:maven/com.fasterxml.jackson.core/jackson-databind@2.9.4"
      - name: Prepare embedded scanner-version drift fixture
        env:
          CURRENT_REPORT: ${{ runner.temp }}/vulnfuse-version-current.sarif
        run: |
          node -e "const fs=require('fs');const document=JSON.parse(fs.readFileSync('packages/core/test/fixtures/sarif.json','utf8'));document.runs[0].tool.driver.semanticVersion='2.26.2';fs.writeFileSync(process.env.CURRENT_REPORT,JSON.stringify(document));"
      - id: version-drift
        name: Gate embedded scanner-version drift after preserving the comparison
        continue-on-error: true
        uses: ./
        with:
          reports: ${{ runner.temp }}/vulnfuse-version-current.sarif
          baseline-reports: packages/core/test/fixtures/sarif.json
          format: json
          output: ${{ runner.temp }}/vulnfuse-version-drift.json
          fail-on-scan-set-change: "true"
      - name: Validate embedded scanner-version Action evidence
        env:
          OUTCOME: ${{ steps.version-drift.outcome }}
          SCAN_SET_CHANGED: ${{ steps.version-drift.outputs.scan-set-changed }}
          REPORT: ${{ steps.version-drift.outputs.report }}
        run: |
          test "$OUTCOME" = "failure"
          test "$SCAN_SET_CHANGED" = "true"
          test -s "$REPORT"
          test "$(node -p "require('$REPORT').scanSetChange.changedToolVersions[0].tool")" = "CodeQL"
          test "$(node -p "require('$REPORT').scanSetChange.changedToolVersions[0].baseline.versions[0]")" = "2.20.0"
          test "$(node -p "require('$REPORT').scanSetChange.changedToolVersions[0].current.versions[0]")" = "2.26.2"
      - name: Prepare SARIF automation-category drift fixtures
        env:
          BASELINE_REPORT: ${{ runner.temp }}/vulnfuse-category-baseline.sarif
          CURRENT_REPORT: ${{ runner.temp }}/vulnfuse-category-current.sarif
        run: |
          node -e "const fs=require('fs');const document=JSON.parse(fs.readFileSync('packages/core/test/fixtures/sarif.json','utf8'));document.runs[0].automationDetails={id:'monorepo/main/2026-08-11'};fs.writeFileSync(process.env.BASELINE_REPORT,JSON.stringify(document));document.runs[0].automationDetails.id='monorepo/release/2026-08-12';fs.writeFileSync(process.env.CURRENT_REPORT,JSON.stringify(document));"
      - id: category-drift
        name: Gate SARIF automation-category drift after preserving the comparison
        continue-on-error: true
        uses: ./
        with:
          reports: ${{ runner.temp }}/vulnfuse-category-current.sarif
          baseline-reports: ${{ runner.temp }}/vulnfuse-category-baseline.sarif
          format: json
          output: ${{ runner.temp }}/vulnfuse-category-drift.json
          fail-on-scan-set-change: "true"
      - name: Validate SARIF automation-category Action evidence
        env:
          OUTCOME: ${{ steps.category-drift.outcome }}
          SCAN_SET_CHANGED: ${{ steps.category-drift.outputs.scan-set-changed }}
          REPORT: ${{ steps.category-drift.outputs.report }}
        run: |
          test "$OUTCOME" = "failure"
          test "$SCAN_SET_CHANGED" = "true"
          test -s "$REPORT"
          test "$(node -p "require('$REPORT').scanSetChange.changedSarifAutomationCategories[0].tool")" = "CodeQL"
          test "$(node -p "require('$REPORT').scanSetChange.changedSarifAutomationCategories[0].baseline.categories[0]")" = "monorepo/main"
          test "$(node -p "require('$REPORT').scanSetChange.changedSarifAutomationCategories[0].current.categories[0]")" = "monorepo/release"

  package-smoke:
    name: Clean package install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack workspaces
        run: |
          mkdir -p package-artifacts
          npm pack -w @vulnfuse/core --pack-destination package-artifacts
          npm pack -w vulnfuse --pack-destination package-artifacts
      - name: Verify a flat checksum manifest for packed artifacts
        run: |
          node scripts/write-release-checksums.mjs package-artifacts package-artifacts/SHA256SUMS.txt
          cd package-artifacts
          sha256sum -c SHA256SUMS.txt
      - name: Install both tarballs in a clean project
        run: |
          mkdir clean-install
          cd clean-install
          npm init -y
          version=$(node -p "require('../package.json').version")
          tar -tzf "../package-artifacts/vulnfuse-core-${version}.tgz" | grep -qx package/THIRD_PARTY_NOTICES.md
          tar -tzf "../package-artifacts/vulnfuse-${version}.tgz" | grep -qx package/THIRD_PARTY_NOTICES.md
          npm install "../package-artifacts/vulnfuse-core-${version}.tgz" "../package-artifacts/vulnfuse-${version}.tgz"
          npx vulnfuse --version
          npx vulnfuse inspect "../packages/core/test/fixtures/{trivy,grype}.json" --json > inspection.json
          test "$(node -p "require('./inspection.json').length")" = "2"
          npx vulnfuse inspect ../packages/core/test/fixtures/openvex.json --json > openvex-inspection.json
          test "$(node -p "require('./openvex-inspection.json')[0].format")" = "openvex"
          test "$(node -p "require('./openvex-inspection.json')[0].findings")" = "3"
          npx vulnfuse inspect ../packages/core/test/fixtures/cyclonedx-vex.xml --json > cyclonedx-xml-inspection.json
          test "$(node -p "require('./cyclonedx-xml-inspection.json')[0].format")" = "cyclonedx"
          test "$(node -p "require('./cyclonedx-xml-inspection.json')[0].findings")" = "1"
          if npx vulnfuse merge ../packages/core/test/fixtures/sarif-incomplete.json --format json --output partial.json --fail-on-incomplete; then
            echo "Expected incomplete SARIF gate to exit 1" >&2
            exit 1
          fi
          test -s partial.json
          test "$(node -p "require('./partial.json').reports[0].warnings.length")" = "5"
          npx vulnfuse merge ../packages/core/test/fixtures/sarif-uri-bases.json --format json --output uri-base.json
          test "$(node -p "require('./uri-base.json').summary.clusters")" = "1"
          test "$(node -p "require('./uri-base.json').clusters[0].primary.location.uri")" = "src/lib/memory.c"
          node -e "const fs=require('fs');const document=JSON.parse(fs.readFileSync('../packages/core/test/fixtures/sarif.json','utf8'));document.runs[0].tool.driver.semanticVersion='2.26.2';fs.writeFileSync('sarif-version-current.json',JSON.stringify(document));"
          if npx vulnfuse diff --baseline ../packages/core/test/fixtures/sarif.json sarif-version-current.json --format json --output version-drift.json --fail-on-scan-set-change; then
            echo "Expected embedded scanner-version gate to exit 1" >&2
            exit 1
          fi
          test -s version-drift.json
          test "$(node -p "require('./version-drift.json').scanSetChange.changedToolVersions[0].tool")" = "CodeQL"
          test "$(node -p "require('./version-drift.json').scanSetChange.changedToolVersions[0].current.versions[0]")" = "2.26.2"
          node -e "const fs=require('fs');const document=JSON.parse(fs.readFileSync('../packages/core/test/fixtures/sarif.json','utf8'));document.runs[0].automationDetails={id:'monorepo/main/2026-08-11'};fs.writeFileSync('sarif-category-baseline.json',JSON.stringify(document));document.runs[0].automationDetails.id='monorepo/release/2026-08-12';fs.writeFileSync('sarif-category-current.json',JSON.stringify(document));"
          if npx vulnfuse diff --baseline sarif-category-baseline.json sarif-category-current.json --format json --output category-drift.json --fail-on-scan-set-change; then
            echo "Expected SARIF automation-category gate to exit 1" >&2
            exit 1
          fi
          test -s category-drift.json
          test "$(node -p "require('./category-drift.json').scanSetChange.changedSarifAutomationCategories[0].tool")" = "CodeQL"
          test "$(node -p "require('./category-drift.json').scanSetChange.changedSarifAutomationCategories[0].baseline.categories[0]")" = "monorepo/main"
          test "$(node -p "require('./category-drift.json').scanSetChange.changedSarifAutomationCategories[0].current.categories[0]")" = "monorepo/release"
          npx vulnfuse merge ../packages/core/test/fixtures/trivy.json ../packages/core/test/fixtures/grype.json --format markdown --output report.md
          grep -q "1 duplicate records were collapsed" report.md
          npx vulnfuse diff --baseline ../packages/core/test/fixtures/trivy.json ../packages/core/test/fixtures/trivy.json ../packages/core/test/fixtures/grype.json --format html --output portable.html
          grep -q "Content-Security-Policy" portable.html
          grep -q "VulnFuse baseline comparison" portable.html
          npm sbom --sbom-format cyclonedx --omit dev > vulnfuse-sbom.cdx.json
          node ../scripts/verify-sbom.mjs vulnfuse-sbom.cdx.json vulnfuse @vulnfuse/core @rgrove/parse-xml commander tinyglobby fdir picomatch
      - uses: actions/upload-artifact@v7
        with:
          name: npm-tarballs
          path: package-artifacts/*.tgz

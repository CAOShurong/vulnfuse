name: Feature proposal
description: Propose a scoped improvement to matching, workflow, or output.
title: "feature: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the current workflow and concrete cost or failure.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Example evidence
      description: Show a synthetic before/after or command example.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and risks
      description: Include false-merge, compatibility, privacy, and performance tradeoffs when relevant.
